name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: app_db
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_user -d app_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://app_user:test_password@localhost:5432/app_db
      DB_NAME: app_db
      DB_USER: app_user
      DB_PASSWORD: test_password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt
    
      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Run tests
        run: python -m pytest -v

      - name: Lint (Ruff)
        run: ruff check .

      - name: Run tests
        run: python -m pytest -v